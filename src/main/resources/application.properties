spring.application.name=shiftsync
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shiftsync}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:noah@123}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.default-schema=public
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

jwt.secret=${SECRET_KEY}
jwt.expiration=${SECRET_KEY_EXPIRATION}

admin_email=${ADMIN_MAIL}
admin_password=${ADMIN_PASSWORD}

